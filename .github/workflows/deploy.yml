name: Deploy to GitHub Pages

# スマホだけで開発できるように、push のたびに自動でビルドして公開する。
on:
  push:
    branches:
      - claude/new-session-fgopj0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数デプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Secrets の FIREBASE_CONFIG を .env.local に展開する
      - name: Firebase の構成値を展開
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/write-env.mjs

      - name: ビルド（型チェック込み）
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
